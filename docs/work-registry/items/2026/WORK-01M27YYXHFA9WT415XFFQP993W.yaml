{"aliases":[],"blockedBy":[],"changeRefs":[],"closure":null,"createdAt":"2026-09-11T10:07:10.383Z","id":"WORK-01M27YYXHFA9WT415XFFQP993W","interpretation":{"status":"agent-derived","summary":"Measured on openspec/changes/grant-module-headers/investigation.json, 438,758 bytes for a change that adds header comments to seven files. applicability is 99 percent of it: semanticDelta 337 KB (230 dispositions at 155 KB, 33 WHY overlays at 108 KB, 2 investigation requirements at 57 KB) and replayContract 100 KB (125 canonical terms at 49 KB, grouping at 37 KB, 3 term contributions at 12 KB). The dispositions, terms and grouping are recomputable from the pinned baseline commit and the scanner version, so a digest binding proves them without carrying the bytes. Within one WHY row only about a third is meaning: why 226, protectedInvariant 303, answer 294 and reviewerQuestion 139 bytes against anchors 391, pathIdentity 207, groupRefs 168 and several digests. The prose is what a reader later needs and should stay; the survey process should be bound, not stored. This is the same ruling already taken for the design.md ledger region in the system description docs plan section 9 item 5, applied to the manifest itself."},"kind":"improvement","lane":null,"schemaVersion":1,"sourceRefs":[],"stage":"inbox","timeline":[{"at":"2026-09-11T10:07:10.383Z","changeId":null,"event":"created"}],"title":"The investigation artifact stores the whole survey rather than its conclusion"}
